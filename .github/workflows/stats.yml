name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, off the hour so it is not queued behind
                           # the pile of jobs everyone schedules at :00
  workflow_dispatch:
  # Deliberately no `push` trigger: this job commits, and a push trigger would
  # re-run it on its own commit.

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-python step and no pip install: generate_stats.py is standard
      # library only, so there is no dependency here that can break in a year.
      - name: Draw the graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit only if something actually changed
        run: |
          FILES="stats.svg streak.svg year.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
